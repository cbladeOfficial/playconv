[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "playconv"
version = "1.0.0"
description = "Universal Music Playlist Converter - Cross-platform conversion, CSV export, and exact track matching"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "click>=8.0",
    "rich>=13.0",
    "requests>=2.28",
    "ytmusicapi>=1.10",
    "yt-dlp>=2024.0",
    "spotipy>=2.24",
    "rapidfuzz>=3.0",
]

[project.scripts]
playconv = "playconv.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["playconv*"]
